# Render Blueprint for MiroFish (place at the root of your fork)
services:
  # ---------- Backend: Flask API + OASIS simulation runner ----------
  - type: web
    name: mirofish-backend
    runtime: python
    plan: standard            # 2 GB RAM; free/starter tends to OOM or sleep mid-simulation
    region: singapore         # closest Render region to India
    buildCommand: pip install uv && cd backend && uv sync --frozen
    startCommand: cd backend && FLASK_PORT=$PORT .venv/bin/python run.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FLASK_DEBUG
        value: "False"
      - key: LLM_API_KEY
        sync: false           # prompted in dashboard
      - key: LLM_BASE_URL
        sync: false           # e.g. https://api.openai.com/v1 or DashScope URL
      - key: LLM_MODEL_NAME
        sync: false           # e.g. gpt-4o-mini / qwen-plus
      - key: ZEP_API_KEY
        sync: false
      - key: OASIS_DEFAULT_MAX_ROUNDS
        value: "10"
    disk:                     # uploads + simulation data survive redeploys
      name: mirofish-uploads
      mountPath: /opt/render/project/src/backend/uploads
      sizeGB: 5

  # ---------- Frontend: Vue/Vite built to static files ----------
  - type: web
    name: mirofish-frontend
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_BASE_URL          # baked in at build time
        value: https://mirofish-backend.onrender.com   # replace with your actual backend URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
